<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Ducks</title>
</head>

<body>
    <h2>Search Ducks</h2>

    <label>Type:</label>
    <input id="type" />
    <button onclick="search()">Search</button>

    <br /><br />

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
            </tr>
        </thead>
        <tbody id="result"></tbody>
    </table>

    <script>
        let ducks = [];
        let host = "http://localhost:8080";

        async function getAll() {
            let response = await fetch(host + "/ducks");
            return await response.json();
        }

        async function search() {
            if (ducks.length === 0) {
                ducks = await getAll();
            }

            let duckType = document.getElementById("type").value.trim().toLowerCase();
            let table = document.getElementById("result");
            table.innerHTML = "";

            for (let duck of ducks) {
                if (!duckType || duck.type.toLowerCase() === duckType) {
                    let row = document.createElement("tr");

                    let cell1 = document.createElement("td");
                    cell1.textContent = duck.id;
                    row.appendChild(cell1);

                    let cell2 = document.createElement("td");
                    cell2.textContent = duck.type;
                    row.appendChild(cell2);

                    table.appendChild(row);
                }
            }
        }
    </script>
</body>

</html>
